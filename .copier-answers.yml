# Changes here will be overwritten by Copier; NEVER EDIT MANUALLY
_commit: v1.26.3
_src_path: https://github.com/hugoh/go-tools.git
coverage_total: 90
gen_check_cmd: git diff --exit-code README.md
gen_cmd:
- go generate ./...
- rumdl check --fix README.md
gen_outputs:
- README.md
gen_sources:
- README.md.tpl
- cmd/**/*.go
- internal/**/*.go
golangci_extra_disable: []
golangci_extra_exclusions: []
golangci_settings: ''
golangci_test_exclude_linters:
- funlen
goreleaser_before_hooks: []
goreleaser_version_pkg: main
has_executable: true
has_fuzz: false
has_gen: true
has_goreleaser: true
has_homebrew_cask: false
has_pages: false
has_test_int: false
nfpm_extra_contents: []
package_format: binary
project_description: Bulk-edit GitHub pull requests (label, reviewer, close, merge)
    from the terminal
project_name: gh-bulk-pr
testcoverage_excludes:
- ^main\.go$
- ^cmd/genreadme/
testcoverage_overrides: []

